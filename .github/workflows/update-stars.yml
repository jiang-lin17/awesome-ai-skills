name: Auto-update Star Counts

on:
  # 每周一凌晨 02:30 UTC 自动跑一次
  schedule:
    - cron: "30 2 * * 1"
  # 也支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update star counts
        run: python scripts/auto_update_stars.py
        env:
          # 用 GITHUB_TOKEN 可以避免 GitHub API 限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "📭 Star 数没变化，跳过 commit"
          else
            git commit -m "🤖 Auto-update star counts ($(date -u +%Y-%m-%d))"
            git push
          fi
