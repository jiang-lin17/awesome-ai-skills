name: Auto-discover + AI Describe New Skills

# 每周一凌晨 02:30 UTC（北京时间 10:30）自动跑
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:  # 也可以手动点 Run workflow

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ========== 阶段 1：自动发现新 Skill ==========
      - name: 🔍 Discover new skills from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auto_discover.py

      # ========== 阶段 2：AI 自动生成大白话 ==========
      # Pollinations.ai 免费 LLM，匿名 ~1次/15s
      # 10 个新 Skill ≈ 2.5 分钟，50 个 ≈ 12.5 分钟
      - name: 🤖 AI generate plain-language descriptions
        run: python scripts/generate_noob_desc.py

      # ========== 阶段 3：提交更新 ==========
      - name: 📦 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 没变化就不 commit
          if git diff --quiet docs/data/skills.json; then
            echo "No changes. Nothing to commit."
            exit 0
          fi

          git add docs/data/skills.json
          git add discovery-logs/ || true

          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "🤖 Auto-discover + AI describe ($TIMESTAMP)"
          git push origin main

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🤖 Weekly Auto-Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repo:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Discover phase:** Scanned 6 GitHub Search queries" >> $GITHUB_STEP_SUMMARY
          echo "- **AI Describe phase:** Pollinations.ai free LLM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Diff above shows what changed!" >> $GITHUB_STEP_SUMMARY
